name: PR contract

# Reads the pull request body, not the code: one Track ticked, a spec or ADR linked, and the
# reviewer subagent's last line with no blockers (AGENTS.md, "Required outputs").
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: PR contract
    # Dependabot writes its own bodies.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the PR body
        env:
          # Passed through the environment, never interpolated into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/pr-contract/check-pr-body.mjs
