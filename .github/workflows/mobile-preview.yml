name: Mobile preview

# Installable preview builds / OTA updates for PRs labeled `mobile-preview`.
# Requires GitHub Environment `mobile-preview` secrets: EXPO_TOKEN
# and variable EXPO_PUBLIC_API_URL. Replace EAS projectId in apps/mobile/app.json.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mobile-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: EAS preview (Android)
    if: contains(github.event.pull_request.labels.*.name, 'mobile-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mobile-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Setup EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Update (JS OTA to preview channel)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          eas update --branch preview --message "PR #${{ github.event.pull_request.number }} @ ${SHORT_SHA}" --non-interactive
      - name: EAS Build (Android preview APK)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          eas build --profile preview --platform android --non-interactive --json --no-wait | tee /tmp/eas-build.json
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = [
              '### Mobile preview',
              '',
              '- OTA update published to the **preview** channel for this PR.',
              '- Android preview build queued (see [EAS dashboard](https://expo.dev)).',
              `- SHA: \`${context.sha.slice(0, 7)}\``,
              '',
              '_Install via Expo dashboard / internal distribution link once the build finishes._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
