name: Deploy PaaS

# Migrations for the free PaaS pilot (Vercel web + Render API + Neon).
# App deploys are Git-driven (Vercel / Render autoDeploy). Keep the VM Deploy
# workflow gated off (PILOT_DEPLOY_ENABLED=false) while this path is active.

on:
  push:
    branches: [main]
    # Skip Neon migrate when the commit is docs / PR-template only.
    # Does not stop Vercel/Render autoDeploy — those are Git-driven outside this workflow.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-paas
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate Neon (PaaS pilot)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    if: ${{ vars.PILOT_PAAS_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable
      - name: Install db workspace
        run: pnpm install --frozen-lockfile --filter @gymos/db...
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @gymos/db db:migrate
