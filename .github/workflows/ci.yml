name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # GitHub Releases occasionally returns transient 5xx (e.g. 503).
          # curl --retry covers 408/429/500/502/503/504; keep a small delay between attempts.
          curl -sSfL --retry 5 --retry-delay 5 --retry-max-time 120 \
            -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan full git history
        run: /tmp/gitleaks git --redact --exit-code 1

  quality:
    name: Format · lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node-24 action runtime (v4 still targets deprecated Node 20).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint (incl. module boundaries)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: OpenAPI drift check
        run: |
          pnpm --filter @gymos/api openapi:generate
          pnpm exec prettier --write packages/contracts/openapi/openapi.v1.json
          git diff --exit-code packages/contracts/openapi/openapi.v1.json
      - name: Test
        run: pnpm test
      - name: Agent hook tests
        run: pnpm test:agent-hooks
      - name: Build (web)
        run: pnpm --filter @gymos/web build
      - name: Install Playwright Chromium
        run: pnpm --filter @gymos/web exec playwright install --with-deps chromium
      - name: Playwright smoke (login screen)
        run: pnpm --filter @gymos/web e2e
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  mobile-bundle:
    name: Mobile Metro bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Expo export (iOS) — fail if Metro cannot bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8787
        run: pnpm exec expo export --platform ios --output-dir /tmp/gymos-mobile-export
