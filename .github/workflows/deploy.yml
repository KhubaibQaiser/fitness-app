name: Deploy

on:
  push:
    branches: [main]
    # Skip image builds when the commit is docs / PR-template only.
    # Code + markdown in the same commit still deploys. workflow_dispatch is unfiltered.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # GHCR requires lowercase owner; never use mixed-case github.repository_owner raw.
  REGISTRY: ghcr.io
  IMAGE_OWNER: khubaibqaiser

jobs:
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          # Owner login is more reliable for package write than github.actor.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # Attestation blobs often 403 on GHCR HEAD checks; images themselves are enough for pilot.
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/gymos-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/gymos-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/gymos-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/gymos-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to pilot VM
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Deploy only when the VM is provisioned (secrets present).
    if: ${{ vars.PILOT_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run migrations against Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter @gymos/db...
          pnpm --filter @gymos/db db:migrate
      - name: Ship compose + Caddy config
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          source: 'infra/vm/compose.prod.yml,infra/vm/Caddyfile,infra/vm/caddy.Dockerfile,infra/vm/deploy.sh'
          target: /srv/gymos
          strip_components: 2
      - name: Deploy
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            chmod +x /srv/gymos/deploy.sh
            /srv/gymos/deploy.sh ${{ needs.build-images.outputs.tag }} || /srv/gymos/deploy.sh --rollback
