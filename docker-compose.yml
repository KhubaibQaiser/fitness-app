# Local development stack — mirrors production shape (Neon → pg, R2 → MinIO).
# Credentials below are local-only placeholders and never used outside localhost.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gymos
      POSTGRES_PASSWORD: gymos
      POSTGRES_DB: gymos
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymos']
      interval: 5s
      timeout: 3s
      retries: 10

  # pg-boss queue state — deliberately separate and ephemeral (no volume),
  # matching production where queue-db lives on the VM and holds no tenant data.
  queue-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gymos
      POSTGRES_PASSWORD: gymos
      POSTGRES_DB: gymos_queue
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymos']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: local-dev-only
      MINIO_ROOT_PASSWORD: local-dev-only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket bootstrap so `docker compose up` yields a ready S3 target.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 local-dev-only local-dev-only &&
      mc mb --ignore-existing local/gymos-media &&
      exit 0
      "

volumes:
  db-data:
  minio-data:
